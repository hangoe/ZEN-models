analysis:
  dataset: snapshot
solver:
  name: gurobi
  solver_options:
    Method: 2
    NodeMethod: 2
    BarHomogeneous: 1
    DualReductions: 0
    Threads: 10
    Crossover: 0
    ScaleFlag: 2
    BarOrder: 0
    BarIterLimit: 3000
  save_duals: true
  use_scaling: false
  run_diagnostics: true
  scaling_include_rhs: true
plugins:
  mga:
    mode: weights
    epsilon: 0.01
    iterations:
    - weights:
        north_until_2030: 1.0
    - weights:
        north_until_2030: -1.0
    - weights:
        west_until_2030: 1.0
    - weights:
        west_until_2030: -1.0
    - weights:
        south_until_2030: 1.0
    - weights:
        south_until_2030: -1.0
    - weights:
        east_until_2030: 1.0
    - weights:
        east_until_2030: -1.0
